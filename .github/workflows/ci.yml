name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q rate_limit_governor.py ratelimit_governor cli.py ratelimit_governor_app.py simulator.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run CLI smoke tests
        run: |
          rate-limit-governor status
          rate-limit-governor backoff --jitter none --attempts 3 --json
          python simulator.py --requests 20 --failure-rate 0.1 --seed 7

      - name: Validate browser JavaScript
        run: node --check app.js
