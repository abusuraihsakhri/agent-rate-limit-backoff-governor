version: '3.8'

services:
  engine-rate-limit-backoff-governor:
    build: .
    container_name: engine-rate-limit-backoff-governor
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=engine-rate-limit-backoff-governor-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
