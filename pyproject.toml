[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rate-limit-backoff-governor"
version = "2.1.0"
description = "Rate limiting and retry-control utilities for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abu Suraih Sakhri" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
rate-limit-governor = "ratelimit_governor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/agent-rate-limit-backoff-governor"
Repository = "https://github.com/abusuraihsakhri/agent-rate-limit-backoff-governor.git"

[tool.setuptools]
py-modules = ["rate_limit_governor"]

[tool.setuptools.packages.find]
include = ["ratelimit_governor*"]
