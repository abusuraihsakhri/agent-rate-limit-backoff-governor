[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-rate-limit-backoff-governor"
version = "2.0.0"
description = "RateLimit-Governor: Token-Bucket & Exponential Jitter Backoff Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
engine-rate-limit-backoff-governor = "ratelimit_governor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/engine-rate-limit-backoff-governor"
Repository = "https://github.com/abusuraihsakhri/engine-rate-limit-backoff-governor.git"
